<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athiva Technology - Download</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            --dark-bg: #0f172a;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Background glow */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(12px);
            position: relative;
        }

        .logo-wrap {
            margin-bottom: 32px;
        }

        .logo-wrap img {
            height: 48px;
            width: auto;
        }

        /* Animated check icon */
        .icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
            border: 2px solid rgba(99,102,241,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.3); }
            50% { box-shadow: 0 0 0 16px rgba(99,102,241,0); }
        }

        .icon-wrap svg {
            width: 36px;
            height: 36px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 28px;
            text-align: left;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-icon svg {
            width: 20px;
            height: 20px;
            color: white;
        }

        .file-details {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-type {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            background: var(--gradient);
            color: white;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-download:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .btn-download svg {
            width: 18px;
            height: 18px;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }

        .status-msg.downloading {
            color: #a78bfa;
        }

        .footer-link {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .footer-link a {
            font-size: 12px;
            color: #475569;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-link a:hover {
            color: #a78bfa;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-wrap">
        <img src="/logo.svg" alt="Athiva Technology">
    </div>

    <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#6366f1"/>
                    <stop offset="100%" stop-color="#ec4899"/>
                </linearGradient>
            </defs>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
    </div>

    <h1>Your download is ready</h1>
    <p class="subtitle">The document from Athiva Technology has been prepared for you.</p>

    <div class="file-info">
        <div class="file-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
        </div>
        <div class="file-details">
            <div class="file-name">Athiva NamVandi</div>
            <div class="file-type">PDF Document</div>
        </div>
    </div>

    <a class="btn-download" href="/Athiva_NamVandi.pdf" download="Athiva_NamVandi.pdf" id="downloadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download PDF
    </a>

    <p class="status-msg" id="statusMsg">If download doesn't start automatically, tap the button above.</p>

    <div class="footer-link">
        <a href="https://athivatech.com">← Back to Athiva Technology</a>
    </div>
</div>

<script>
    // Auto-download on page load
    window.addEventListener('load', function () {
        var msg = document.getElementById('statusMsg');
        var btn = document.getElementById('downloadBtn');

        try {
            var link = document.createElement('a');
            link.href = '/Athiva_NamVandi.pdf';
            link.download = 'Athiva_NamVandi.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            msg.textContent = 'Download started automatically.';
            msg.classList.add('downloading');
        } catch (e) {
            msg.textContent = 'Tap the button above to download.';
        }
    });
</script>

</body>
</html>
